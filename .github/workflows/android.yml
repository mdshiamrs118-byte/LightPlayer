name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Needed to publish a GitHub Release when you push a tag such as v1.8
permissions:
  contents: write

jobs:
  build:
    name: Build release & debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provides a `gradle` command on PATH, so the build does not depend on a
      # committed gradlew script / gradle-wrapper.jar.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The action's default package list contains the removed "tools" package,
      # which makes sdkmanager fail, so install only what exists.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # If you added the KEYSTORE_BASE64 secret, the release APK is signed with your own key
      # (see "Release signing" in the README). Otherwise it uses the debug key.
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found: the release APK will be signed with your key."
          else
            echo "No KEYSTORE_BASE64 secret: the release APK will use the debug key."
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Name the release APK
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "LightPlayer-v${VERSION}.apk"
          echo "APK_FILE=LightPlayer-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Push a tag like v1.8 to publish the signed APK as a GitHub Release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
