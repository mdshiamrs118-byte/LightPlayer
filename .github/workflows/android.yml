name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build release & debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

          yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --sdk_root=$ANDROID_SDK_ROOT

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Generate Gradle wrapper (for local convenience)
        if: github.event_name == 'push'
        run: ./gradlew wrapper --gradle-version 8.7 --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
